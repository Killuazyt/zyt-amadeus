[build-system]
requires = ["setuptools>=75,<82", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "amadeus-desktop"
version = "0.2.0.dev2"
description = "Windows desktop-pet window and sprite engine for the Amadeus companion"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pip>=24,<26",
    "pip-tools>=7.4,<8",
    "pytest>=8.3,<10",
    "pytest-qt>=4.4,<5",
    "ruff>=0.9,<1",
    "setuptools>=75,<82",
    "wheel>=0.45,<1",
]

[project.scripts]
amadeus-desktop = "amadeus_desktop.__main__:main"
amadeus-pet-import = "amadeus_desktop.tools.pet_import:main"
amadeus-pet-preview = "amadeus_desktop.tools.pet_preview:main"
amadeus-pet-acceptance = "amadeus_desktop.tools.pet_acceptance:main"
amadeus-pet-snapshot = "amadeus_desktop.tools.pet_snapshot:main"
amadeus-pet-runtime-probe = "amadeus_desktop.tools.pet_runtime_probe:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
amadeus_desktop = [
    "resources/builtin_pet/*.json",
    "resources/builtin_pet/*.png",
    "resources/builtin_pet/*.txt",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]
