[build-system]
requires = ["setuptools>=77,<82", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "amadeus-desktop"
version = "0.7.0.dev7"
description = "Windows desktop pet with secure chat and auditable local memory"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Killuazyt"}]
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastembed==0.8.0",
    "PySide6>=6.8,<7",
    "httpx>=0.28,<1",
    "numpy==2.4.2",
    "onnxruntime==1.24.4",
    "Pillow>=11,<13",
    "pypdf>=5,<7",
    "pywin32==312",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pip>=24,<26",
    "pip-tools>=7.4,<8",
    "PyInstaller==6.21.0",
    "pyinstaller-hooks-contrib==2026.6",
    "pytest>=8.3,<10",
    "pytest-qt>=4.4,<5",
    "ruff>=0.9,<1",
    "setuptools>=77,<82",
    "wheel>=0.45,<1",
]

[project.scripts]
amadeus-desktop = "amadeus_desktop.__main__:main"
amadeus-pet-import = "amadeus_desktop.tools.pet_import:main"
amadeus-pet-preview = "amadeus_desktop.tools.pet_preview:main"
amadeus-pet-acceptance = "amadeus_desktop.tools.pet_acceptance:main"
amadeus-pet-snapshot = "amadeus_desktop.tools.pet_snapshot:main"
amadeus-pet-runtime-probe = "amadeus_desktop.tools.pet_runtime_probe:main"
amadeus-model = "amadeus_desktop.tools.model:main"
amadeus-persona = "amadeus_desktop.tools.persona:main"
amadeus-embedding-acceptance = "amadeus_desktop.tools.embedding_acceptance:main"
amadeus-index-acceptance = "amadeus_desktop.tools.index_acceptance:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
amadeus_desktop = [
    "resources/app_icon/*.png",
    "resources/app_icon/*.txt",
    "resources/builtin_pet/*.json",
    "resources/builtin_pet/*.png",
    "resources/builtin_pet/*.webp",
    "resources/builtin_pet/*.txt",
    "resources/licenses/*.json",
    "resources/licenses/*.txt",
    "resources/provider_catalog/*.json",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]
